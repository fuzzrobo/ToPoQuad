controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 400  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    neck_controller:
      type: joint_trajectory_controller/JointTrajectoryController

imu_broadcaster:
  ros__parameters:
    use_sim_time: true
    frame_id: imu_link
    sensor_name: imu_sensor

leg_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - FR_hip_yaw
      - FR_hip_pitch
      - FR_knee_pitch
      - FL_hip_yaw
      - FL_hip_pitch
      - FL_knee_pitch
      - BL_hip_yaw
      - BL_hip_pitch
      - BL_knee_pitch
      - BR_hip_yaw
      - BR_hip_pitch
      - BR_knee_pitch

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 200.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.01

neck_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - neck_pan
      - neck_tilt

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 200.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.01
