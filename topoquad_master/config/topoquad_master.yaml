/topoquad/leg_node:
    ros__parameters:
        # control_mode: "velocity"
        control_mode: "velocity_current"
        # control_mode: "position"
        outer_gain:
          p: 9.5
          i: 0.0
          d: 6.5
        dynamixel_gain:
          vel_p: 1000.0
          pos_p: 800.0
        overshoot: 0.0
        deadband: 0.01
        leg_dynamixel_IDs:
          br: [ 4,  3,  2] # hip_yaw, hip_pitch, knee_pitch
          fr: [14, 13, 12] # hip_yaw, hip_pitch, knee_pitch
          fl: [24, 23, 22] # hip_yaw, hip_pitch, knee_pitch
          bl: [34, 33, 32] # hip_yaw, hip_pitch, knee_pitch
        initial_pose_deg:
          fr: [0.0, 45.0, 45.0]
          fl: [0.0, 45.0, 45.0]
          br: [0.0, 45.0, 45.0]
          bl: [0.0, 45.0, 45.0]

/topoquad/neck_node:
    ros__parameters:
        pantilt_dynamixel_ID: [43, 42]
